# rtmp_in (:1935) — always present. Per-source-IP concurrency cap (ge 21 → 20
# concurrent publishes per NAT'd source IP) + connection-rate cap (2× the
# concurrency cap so a full simultaneous reconnect is never rate-rejected).
frontend rtmp_in
    bind *:1935
    mode tcp
    option tcplog
    # No timeout client override: the 60s default only governs the pre-tunnel
    # handshake; established sessions are governed by timeout tunnel in
    # 30-backend-rtmp.cfg, so stream duration is unlimited either way.
    # Reap vanished publishers (killed ffmpeg, dropped network) in ~1 min so
    # their ghost connections release sc0_conn_cur slots and the SRS stream
    # key. Without SO_KEEPALIVE the dead socket would idle until the tunnel
    # timeout (see 30-backend-rtmp.cfg).
    option clitcpka
    clitcpka-idle 30s
    clitcpka-intvl 10s
    clitcpka-cnt 3
    stick-table type ip size 100k expire 60s store conn_cur,conn_rate(30s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur ge 21 }
    tcp-request connection reject if { sc0_conn_rate ge 40 }
    default_backend rtmp_origin
