backend rtmp_origin
    mode tcp
    option tcp-check
    # In TCP mode the tunnel timeout supersedes timeout client/server once the
    # connection is established — the 24h default would keep dead publisher
    # sessions (and their sc0_conn_cur slots + SRS stream keys) alive for a
    # day. A live RTMP publish always has data flowing, so 10m of silence in
    # both directions means the session is dead. Backend-scoped: HLS and
    # /sign keep the 24h default from 00-global.cfg. No timeout server
    # override for the same reason — the 60s default only applies pre-tunnel.
    timeout tunnel 10m
    option srvtcpka
    server origin1 @SRS_VPC_IP@:1935 check inter 10s rise 2 fall 3
